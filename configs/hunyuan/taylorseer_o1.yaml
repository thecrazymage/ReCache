diffusion_wrapper:
  wrapper_class: "HunyuanWrapper"

  parameters:
    nfe: 50
    fps: 15
    width: 640
    height: 480
    num_frames: 65
    guidance_scale: 6.0

caching_helper:
  cacher_class: "TaylorSeerHelper"
  parameters:
    order: 1

logit_predictor:
  predictor_variant: "MLP"

  parameters:
    input_dim: 128

    embed_dims: [256, 256, 128]
    budget_conditioning: True
    budget_embedding_interpolate: True
    budget_embedding_max_period: 1000

training:
  seed: null
  epochs: 50

  dataset:
    path: "data/datasets/hunyuan"
    train_size: 64
    val_size: 64
    test_size: 128

  global_batch_size: 8
  micro_batch_size: 1

  budget_scheduler:
    min_val: 2
    max_val: 24
    weight: 0.5

    min_emp_val: 6
    max_emp_val: 15
    emp_weight: 1.0

  reinforce:
    num_samples: 6

  metric:
    metric_name: "PLPIPS_HPS"
    parameters:
      alpha_plpips: 1.0
      alpha_hps: 7.0

  entropy_alpha: 0.01
  optimizer_lr: 0.0005

logging:
  logger_class: "CometLogger"

  parameters:
    project_name: "hunyuan-training"

    val_frequency: 5
    test_frequency: 10

    test_metrics: ['LPIPS', 'PLPIPS', 'L1', 'AQ', 'HPS', 'CLIP', 'IR', 'PSNR', 'SSIM']

    eval_budget: 9
    batch_size: 1
    log_size: 1

    grad_mean_num_iters: 8

    checkpoint_path: 'checkpoints'

    log_multistep:
      project_name: "hunyuan-multistep"
      budgets: [7, 9, 13]
